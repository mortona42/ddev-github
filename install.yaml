name: ddev-github

# list of files and directories listed that are copied into project .ddev directory
# Each file should contain #ddev-generated so it can be replaced by a later `ddev get`
# if it hasn't been modified by the user.
# DDEV environment variables can be interpolated into these filenames
project_files:
  - web-build/Dockerfile.gh
  - commands/web/gh
  - commands/host/gh-setup
  - config.gh.yaml
  - gh/.gitignore

ddev_version_constraint: '>= v1.24.3'

post_install_actions:
  # There is more than one sensible way to give the container a GitHub login --
  # a stored login in the project, a copy of the host's, or a GH_TOKEN -- so ask
  # rather than picking one. `ddev add-on get` runs this with stdin and stdout on
  # pipes, so gh-setup talks to /dev/tty; when there is no terminal (CI, or
  # DDEV_NONINTERACTIVE) it keeps the shipped defaults and says how to re-run.
  - |
    #ddev-description:Configure gh authentication
    bash ./commands/host/gh-setup --from-install

removal_actions:
  # `ddev add-on remove` leaves the credentials behind on purpose -- deleting
  # someone's login is not a removal's business -- but the .gitignore that kept
  # them out of git is part of the add-on and does go. Say so.
  #
  # The directory is whatever `ddev gh-setup` last configured, not necessarily
  # the default. Removal actions run from .ddev, before the files are deleted.
  - |
    #ddev-description:Check for leftover gh credentials
    dir=$(sed -n 's|^[[:space:]]*-[[:space:]]*GH_CONFIG_DIR=/var/www/html/||p' config.gh.yaml 2>/dev/null | tail -n1)
    dir=${dir:-.ddev/gh}
    if [ -e "../${dir}/hosts.yml" ] || [ -e "../${dir}/config.yml" ]; then
      echo "gh add-on: ${dir} still holds your GitHub CLI login. This removal leaves it there."
      echo "'ddev gh auth logout' is gone with the add-on, so delete the credentials by hand"
      echo "when you are done with them:  rm -rf ${dir}"
      if [ "${dir}" = ".ddev/gh" ]; then
        echo "The .gitignore that kept them out of git was part of the add-on and has gone too"
        echo "-- until then the token is one 'git add' away from being committed."
      fi
    fi
